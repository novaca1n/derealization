name: Build derealization

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name override (e.g., 4.1.2)'
        required: false
        type: string
      version_code:
        description: 'Version code override (e.g., 53)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"'
  GRADLE_USER_HOME: '${{ github.workspace }}/.gradle'

jobs:
  build:
    name: Build APK (JDK 21, Android SDK 37)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          # Use the pre-installed Android SDK on GitHub runners
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # Install required packages using sdkmanager (non-interactive)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;27.2.12479018" "platform-tools" >/dev/null
          
          # Verify installation
          $ANDROID_HOME/platform-tools/adb version
          echo "Android SDK setup complete"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ${{ env.GRADLE_USER_HOME }}/caches
          key: gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: gradle-deps-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bundle TweakStore
        run: ./tools/bundle-tweakstore.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Release APK
        run: ./build.sh assembleRelease
        env:
          RELEASE_KEYS: ${{ secrets.RELEASE_KEYS_PATH }}

      - name: Find APKs
        id: find-apks
        run: |
          echo "apks<<EOF" >> $GITHUB_OUTPUT
          find app/build/outputs -name '*.apk' -type f | sort >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: derealization-release-apk
          path: ${{ steps.find-apks.outputs.apks }}
          retention-days: 90
          if-no-files-found: error

      - name: Generate Build Info
        id: build-info
        run: |
          APK_PATH=$(find app/build/outputs -name '*-release.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "APK: $APK_PATH"
          echo "Size: $SIZE bytes"
          echo "SHA256: $SHA256"

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            ${{ steps.build-info.outputs.apk_path }}
          retention-days: 90

  build-debug:
    name: Build Debug APK (PR checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;37.0.0" "ndk;27.2.12479018" "platform-tools" >/dev/null
          
          $ANDROID_HOME/platform-tools/adb version
          echo "Android SDK setup complete"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bundle TweakStore (download latest release)
        run: ./tools/bundle-tweakstore.sh

      - name: Build Debug APK
        run: ./build.sh assembleDebug

      - name: Run Lint
        run: ./build.sh lintDebug
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: derealization-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: derealization-release-apk
          path: artifacts

      - name: Prepare Release Assets
        id: prep
        run: |
          APK_FILE=$(find artifacts -name '*.apk' -type f | head -1)
          VERSION=${GITHUB_REF_NAME#v}
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: derealization ${{ steps.prep.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.prep.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}